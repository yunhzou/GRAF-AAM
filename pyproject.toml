[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "graft"
version = "0.2.0"
description = "WBO-graph atom alignment + per-mode reactive scoring + ranked HTML viewer for transition-state initial guesses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["chemistry", "transition-state", "xtb", "wbo", "alignment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.23",
    "networkx>=2.8",
    "pynauty>=2.8",
    "sympy>=1.10",
]

[project.optional-dependencies]
notebook = ["rdkit>=2022.9", "z3-solver>=4.13", "py3Dmol>=2.0", "nbformat", "nbclient", "ipykernel", "jupyterlab"]
postprocessing = ["z3-solver>=4.13"]
dev = ["pytest", "nbclient", "ipykernel"]
smiles = ["rdkit>=2022.9"]
catalog = ["rdkit>=2022.9", "msgspec>=0.21"]
benchmark = ["rdkit>=2022.9", "z3-solver>=4.13"]
sessions = ["pymongo>=4.6"]

[project.scripts]
graft = "graft.cli:main"

[project.urls]
Homepage = "https://github.com/yunhzou/GRAF-AAM"
Repository = "https://github.com/yunhzou/GRAF-AAM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graft = ["static/*.js", "static/*.html", "static/*.css", "static/LICENSES/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Note: xtb (Grimme) is a runtime requirement but not a Python dependency;
# install it via your system package manager (e.g. conda install -c conda-forge xtb).
